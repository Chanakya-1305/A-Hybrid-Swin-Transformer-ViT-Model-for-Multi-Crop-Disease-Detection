<!DOCTYPE html>
<html>
<head>

<title>Result</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

<style>
  /* Navbar */
  .navbar{
background:rgba(0,102,204,0.95);
backdrop-filter: blur(8px);
padding:15px 0;
}
  .logo {
    font-size: 30px;
    font-weight: bold;
    color: white;
  }
  .nav-link {
    color: white !important;
    margin-left: 20px;
    font-weight: 500;
  }
  body {
    padding-top: 80px;
  }

  .result-image {
    width: 100%;
    max-width: 360px;
    height: 360px;
    object-fit: contain;
    border: 1px solid #dee2e6;
    border-radius: 8px;
    background: #f8f9fa;
  }
</style>

</head>

<body>
<nav class="navbar navbar-expand-lg navbar-dark fixed-top" style="background: rgba(0,102,204,0.95); backdrop-filter: blur(5px);">

<div class="container">

<a class="navbar-brand logo" href="/">Plant Care AI</a>

<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">

<span class="navbar-toggler-icon"></span>

</button>

<div class="collapse navbar-collapse" id="menu">

<ul class="navbar-nav ms-auto">

<li class="nav-item">
<a class="nav-link" href="{{ url_for('home') }}">Home</a>
</li>

<li class="nav-item">
<a class="nav-link" href="{{ url_for('about') }}">About</a>
</li>

<li class="nav-item">
<a class="nav-link" href="{{ url_for('dashboard') }}">Detect</a>
</li>

<li class="nav-item">
<a class="nav-link" href="{{ url_for('login') }}">Login</a>
</li>

<li class="nav-item">
<a class="nav-link" href="{{ url_for('signup') }}">Sign Up</a>
</li>

</ul>

</div>

</div>

</nav>

<div class="container mt-5">

<h2>Prediction Result</h2>

<h4>Disease : {{disease}}</h4>

<h4>Confidence : {{confidence}} %</h4>

<div class="row">

<div class="col-md-6">
<h5>Uploaded Image</h5>
<img src="/{{image}}" class="result-image" alt="Uploaded image">
</div>

<div class="col-md-6">
<h5>Grad-CAM</h5>
{% if gradcam %}
<img src="/{{gradcam}}" class="result-image" alt="Grad-CAM heatmap">
{% else %}
<div class="alert alert-secondary">Grad-CAM not generated for this prediction.</div>
{% endif %}
</div>

</div>

<br>

<a href="/dashboard" class="btn btn-success">Upload Another Image</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
