<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login | crop disease detection</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">

    <style>
        /* Navbar */
        .navbar{
            background:rgba(0,102,204,0.95);
            backdrop-filter: blur(8px);
            padding:15px 0;
}
        .logo {
            font-size: 30px;
            font-weight: bold;
            color: white;
        }
        .nav-link {
            color: white !important;
            margin-left: 20px;
            font-weight: 500;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(rgba(0, 0, 0, 0.45), rgba(0, 0, 0, 0.45)), url('/static/leafimage.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding-top: 80px;
        }

        .login-container {
            background-color: white;
            padding: 2.5rem 2rem;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 420px;
        }

        .login-container h2 {
            text-align: center;
            font-weight: 600;
            margin-bottom: 1.5rem;
        }

        .form-control {
            border-radius: 10px;
        }

        .btn-login {
            width: 100%;
            border-radius: 10px;
            padding: 0.6rem;
            font-weight: 500;
        }

        .bottom-text {
            margin-top: 1rem;
            text-align: center;
            font-size: 0.9rem;
        }

        .bottom-text a {
            text-decoration: none;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark fixed-top" style="background: rgba(0,102,204,0.95); backdrop-filter: blur(5px);">

<div class="container">

<a class="navbar-brand logo" href="/">Plant Care AI</a>

<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">

<span class="navbar-toggler-icon"></span>

</button>

<div class="collapse navbar-collapse" id="menu">

<ul class="navbar-nav ms-auto">

<li class="nav-item">
<a class="nav-link" href="{{ url_for('home') }}">Home</a>
</li>

<li class="nav-item">
<a class="nav-link" href="{{ url_for('about') }}">About</a>
</li>

<li class="nav-item">
<a class="nav-link" href="{{ url_for('dashboard') }}">Detect</a>
</li>

<li class="nav-item">
<a class="nav-link" href="{{ url_for('login') }}">Login</a>
</li>

<li class="nav-item">
<a class="nav-link" href="{{ url_for('signup') }}">Sign Up</a>
</li>

</ul>

</div>

</div>

</nav>

<div class="login-container" style="margin-top: 60px;">
    <h2>Login</h2>
    
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}
    
    <form method="POST">
        <div class="mb-3">
            <label for="username" class="form-label">Username</label>
            <input type="text" name="username" class="form-control" id="username" placeholder="Enter your username" required>
        </div>
        
        <div class="mb-4">
            <label for="password" class="form-label">Password</label>
            <input type="password" name="password" class="form-control" id="password" placeholder="Enter your password" required>
        </div>
        
        <button type="submit" class="btn btn-primary btn-login">Login</button>
    </form>
    
    <div class="bottom-text">
        Don't have an account? <a href="{{ url_for('signup') }}">Sign Up</a>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
