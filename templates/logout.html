<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logged Out</title>
    <meta http-equiv="refresh" content="2;url={{ url_for('login') }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #e8f4ff 0%, #ffffff 100%);
        }

        .logout-card {
            width: min(92vw, 520px);
            background: #ffffff;
            border-radius: 14px;
            box-shadow: 0 8px 22px rgba(0, 0, 0, 0.1);
            padding: 2rem;
            text-align: center;
        }

        .logout-card h1 {
            font-size: 1.8rem;
            margin-bottom: 0.8rem;
            color: #0d6efd;
        }

        .logout-card p {
            margin-bottom: 1.2rem;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="logout-card">
        <h1>You have been logged out</h1>
        <p>Redirecting to login page in 2 seconds...</p>
        <a href="{{ url_for('login') }}" class="btn btn-primary">Go to Login Now</a>
    </div>

    <script>
        setTimeout(function () {
            window.location.replace("{{ url_for('login') }}");
        }, 2000);
    </script>
</body>
</html>
