<!DOCTYPE html>
<html>
<head>

<title>Dashboard</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

<style>
  /* Navbar */
  .navbar{
    background:rgba(0,102,204,0.95);
    backdrop-filter: blur(8px);
    padding:15px 0;
}
  .logo {
    font-size: 30px;
    font-weight: bold;
    color: white;
  }
  .nav-link {
    color: white !important;
    margin-left: 20px;
    font-weight: 500;
  }
  body {
    padding-top: 80px;
  }
</style>

</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark fixed-top" style="background: rgba(0,102,204,0.95); backdrop-filter: blur(5px);">

<div class="container">

<a class="navbar-brand logo" href="/">Plant Care AI</a>

<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">

<span class="navbar-toggler-icon"></span>

</button>

<div class="collapse navbar-collapse" id="menu">

<ul class="navbar-nav ms-auto">

<li class="nav-item">
<a class="nav-link" href="{{ url_for('home') }}">Home</a>
</li>

<li class="nav-item">
<a class="nav-link" href="{{ url_for('about') }}">About</a>
</li>

<li class="nav-item">
<a class="nav-link" href="{{ url_for('dashboard') }}">Detect</a>
</li>

<li class="nav-item">
<a class="nav-link" href="{{ url_for('logout') }}">Logout</a>
</li>

</ul>

</div>

</div>

</nav>

<div class="container mt-5">
<h2>Crop Disease Detection</h2>

{% with messages = get_flashed_messages(with_categories=true) %}
{% if messages %}
  {% for category, message in messages %}
  <div class="alert alert-{{ category }} mt-3" role="alert">{{ message }}</div>
  {% endfor %}
{% endif %}
{% endwith %}

<form action="{{ url_for('predict') }}" method="post" enctype="multipart/form-data" id="predict-form">

<input type="file" name="image" class="form-control" accept="image/*" required><br>

<button class="btn btn-primary" id="predict-btn" type="submit">Check Disease</button>

</form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
  const form = document.getElementById('predict-form');
  const btn = document.getElementById('predict-btn');

  form.addEventListener('submit', function () {
    btn.disabled = true;
    btn.textContent = 'Checking...';
  });
</script>
</body>
</html>
